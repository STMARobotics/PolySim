name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Build, Test, and CDK Diff (PR or branch)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build, test, and synthesize
        run: npm run verify
      - name: Build offline application
        run: npm run build:offline
      - name: Build standalone application
        run: node scripts/build-standalone.mjs
      - name: Configure AWS Credentials via OIDC
        if: github.event_name == 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::738044534240:role/GitHubAction-PullRequestRole
          aws-region: us-east-2
      - name: CDK Diff
        if: github.event_name == 'pull_request'
        run: npm run cdk:diff -- --method=template

  deploy:
    name: Build, Test, and Deploy AWS CDK Stacks (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build, test, and synthesize
        run: npm run verify
      - name: Build offline application
        run: npm run build:offline
      - name: Build standalone application
        run: node scripts/build-standalone.mjs
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::738044534240:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-2
      - name: Check AWS account and region
        run: npm run deployment:preflight
      - name: Review infrastructure diff
        run: npm run cdk:diff -- --method=template --fail-on=never
      - name: Deploy CDK Stacks
        run: npm run cdk:deploy -- --require-approval never --outputs-file deployment-outputs.json
      - name: Smoke test public application
        run: npm run deployment:smoke
